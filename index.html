<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VYOMA — Atmospheric Intelligence &amp; Telemetry</title>
  <meta name="description" content="Instantaneous atmospheric telemetry, real-time air quality, world radar command, and 5-year ERA5 climate intelligence." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2242%22 fill=%22%23070D19%22 stroke=%22%2338BDF8%22 stroke-width=%226%22/><circle cx=%2250%22 cy=%2250%22 r=%2216%22 fill=%22%230EA5E9%22/></svg>" />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (pinned v7 with classic JSX runtime) -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- VYOMA Stylesheet -->
  <link rel="stylesheet" href="css/vyoma.css" />
</head>
<body class="bg-[#040812] text-slate-100 antialiased selection:bg-sky-500/30 selection:text-sky-200">
  <div id="root">
    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-gradient-to-b from-[#070D19] to-[#0E1A2F]">
      <div class="w-14 h-14 rounded-2xl bg-sky-500/15 border border-sky-400/30 flex items-center justify-center shadow-[0_0_30px_rgba(56,189,248,0.25)] animate-pulse mb-4">
        <div class="w-6 h-6 rounded-full border-2 border-sky-400 border-t-transparent animate-spin"></div>
      </div>
      <div class="text-lg font-light tracking-[0.45em] text-white pl-[0.45em]">VYOMA</div>
      <div class="text-[11px] uppercase tracking-[0.25em] text-sky-400/80 mt-2">Initializing Telemetry</div>
    </div>
  </div>

  <script type="module">
    function showLoadError(title, detail) {
      const root = document.getElementById("root");
      if (!root) return;
      root.innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-6 text-center bg-[#070D19]">
          <div class="max-w-sm p-7 rounded-3xl bg-[#101C30]/80 border border-sky-400/20 shadow-2xl text-slate-100">
            <h3 class="text-lg font-semibold tracking-wide mb-2">${title}</h3>
            <p class="text-xs text-slate-400 mb-5 leading-relaxed">${detail}</p>
            <a href="standalone.html" class="inline-block w-full py-3 rounded-2xl bg-gradient-to-r from-[#0284C7] to-[#0EA5E9] text-white font-semibold text-xs tracking-wider shadow-lg shadow-sky-500/25">
              OPEN STANDALONE.HTML
            </a>
          </div>
        </div>
      `;
    }

    async function bootVyoma() {
      try {
        if (!window.React || !window.ReactDOM || !window.Babel) {
          throw new Error("Required runtime libraries (React or Babel) failed to load.");
        }

        const [iconsMod, weatherCodesMod, apiMod, jsxRes] = await Promise.all([
          import("./js/icons.js"),
          import("./js/weather-codes.js"),
          import("./js/api.js"),
          fetch("./js/app.jsx")
        ]);

        if (!jsxRes.ok) {
          throw new Error(`Failed to fetch ./js/app.jsx (HTTP ${jsxRes.status})`);
        }

        const rawJsx = await jsxRes.text();
        const cleanedJsx = rawJsx
          .replace(/^import\s+\{[^}]+\}\s+from\s+"\.\/[^"]+";\r?\n?/gm, "")
          .replace(/^export\s+/gm, "");

        const compiled = window.Babel.transform(cleanedJsx, {
          presets: [["react", { runtime: "classic" }]]
        }).code;

        const factory = new Function(
          "Icon",
          "WeatherGlyph",
          "CelestialIllustration",
          "getWeatherMeta",
          "PRESET_CITIES",
          "GLOBAL_RADAR_HUBS",
          "searchCities",
          "getLiveWeather",
          "getAirQuality",
          "getHistoricalClimate",
          "reverseGeocode",
          "fetchGlobalHubSnapshots",
          "fetchGlobalRadarFrames",
          "getCached",
          `${compiled}\nreturn VyomaApp;`
        );

        const VyomaApp = factory(
          iconsMod.Icon,
          iconsMod.WeatherGlyph,
          iconsMod.CelestialIllustration,
          weatherCodesMod.getWeatherMeta,
          apiMod.PRESET_CITIES,
          apiMod.GLOBAL_RADAR_HUBS,
          apiMod.searchCities,
          apiMod.getLiveWeather,
          apiMod.getAirQuality,
          apiMod.getHistoricalClimate,
          apiMod.reverseGeocode,
          apiMod.fetchGlobalHubSnapshots,
          apiMod.fetchGlobalRadarFrames,
          apiMod.getCached
        );

        const container = document.getElementById("root");
        const root = window.ReactDOM.createRoot(container);
        root.render(window.React.createElement(VyomaApp));
      } catch (err) {
        console.error("VYOMA bootstrap error:", err);
        if (window.location.protocol === "file:") {
          showLoadError(
            "Launch Standalone Portal",
            "Browsers restrict ES module imports over <code>file:///</code>. Open <b>standalone.html</b> or run <b>start-server.bat</b>."
          );
        } else {
          showLoadError("Telemetry Startup Error", err?.message || "Unable to initialize VYOMA.");
        }
      }
    }

    bootVyoma();
  </script>
</body>
</html>
